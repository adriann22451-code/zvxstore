<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZVX STORE – Pulsa & Jasa Online</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f7ae0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZVX STORE">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f2f5fa;--card:#fff;--tx:#14213d;--mut:#6b7a90;--pri:#1f7ae0;--pri2:#4a9bf0;--line:#e3e9f2;--ok:#16a34a;--warn:#f59e0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--card:#18212f;--tx:#e8eef7;--mut:#8a99b0;--line:#26324a;--pri:#4a9bf0;--pri2:#2f7fd6}}
:root[data-theme="dark"]{--bg:#0e1522;--card:#18212f;--tx:#e8eef7;--mut:#8a99b0;--line:#26324a;--pri:#4a9bf0;--pri2:#2f7fd6}
*{box-sizing:border-box;margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
html,body{background:var(--bg);color:var(--tx)}
body{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.hero{background:linear-gradient(160deg,var(--pri),var(--pri2));color:#fff;padding:22px 20px 70px;border-radius:0 0 28px 28px}
.bal{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:700}
.bal small{font-size:16px;font-weight:500}
.eye{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
.acts{display:flex;justify-content:space-between;margin-top:22px}
.acts button{background:none;border:0;color:#fff;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex:1}
.acts i{font-style:normal;width:50px;height:50px;border:2px solid rgba(255,255,255,.55);border-radius:14px;display:grid;place-items:center;font-size:22px}
.box{background:var(--card);border-radius:18px;margin:0 14px;padding:16px 8px;box-shadow:0 2px 10px rgba(20,33,61,.08)}
.up{margin-top:-46px;position:relative}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 0}
.grid button{background:none;border:0;color:var(--tx);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:4px}
.grid i{font-style:normal;font-size:28px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--bg)}
h2{font-size:17px;margin:20px 18px 10px}
.promo{margin:14px;padding:18px;border-radius:18px;background:linear-gradient(120deg,#ffb000,#ff7a00);color:#fff}
.promo b{font-size:18px;display:block;margin-bottom:4px}
.promo button{margin-top:10px;background:#fff;color:#c25b00;border:0;border-radius:20px;padding:8px 16px;font-weight:700;cursor:pointer}
.list{margin:0 14px;background:var(--card);border-radius:18px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);gap:10px}
.row:last-child{border:0}
.row small{color:var(--mut);display:block;margin-top:2px}
.amt{font-weight:700;white-space:nowrap}.neg{color:var(--tx)}.pos{color:var(--ok)}
.empty{padding:28px 16px;text-align:center;color:var(--mut)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;border:0;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:1}
nav button.on{color:var(--pri);font-weight:700}
nav i{font-style:normal;font-size:22px}
nav .pay{transform:translateY(-22px);color:#fff}
nav .pay i{background:var(--pri);width:60px;height:60px;border-radius:50%;display:grid;place-items:center;box-shadow:0 4px 12px rgba(31,122,224,.45)}
nav .pay span{color:var(--pri);font-weight:700;margin-top:-2px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
.ov.on{display:block}
.sheet{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:18px;margin-bottom:14px}
label{font-size:13px;color:var(--mut);display:block;margin:12px 0 6px}
input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:var(--bg);color:var(--tx)}
input:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--tx);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;font-size:14px}
.chip small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.chip.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,var(--card))}
.cta{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:var(--pri);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.cta:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:8px;margin-bottom:6px}
.tabs button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--tx);cursor:pointer}
.tabs .on{border-color:var(--pri);color:var(--pri);font-weight:700}
.op{display:inline-block;margin-top:6px;font-size:12px;background:var(--pri);color:#fff;border-radius:8px;padding:2px 8px}
.svc{display:flex;gap:12px;align-items:center}
.svc i{font-style:normal;font-size:26px;width:46px;height:46px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.btn2{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#14213d;color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;z-index:20;display:none;max-width:90%}
.ok{text-align:center;padding:10px 0}.ok div{font-size:52px}
.receipt{background:#fff;color:#111;border-radius:12px;padding:18px;border:1px dashed #999;font-family:"Courier New",monospace}
.receipt *{font-family:inherit}
.rh{text-align:center;margin-bottom:8px}.rh b{font-size:20px}
.rl{border-top:1px dashed #888;margin:10px 0}
.rr{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin:5px 0}.rr span{color:#555}.rr b{text-align:right}.rr.big{font-size:16px}
.rf{text-align:center;font-size:12px;color:#555}
@media print{body>*:not(.ov){display:none!important}.ov{position:static;background:none;display:block}.sheet{position:static;transform:none;max-width:320px;margin:0 auto;padding:0;overflow:visible;max-height:none;background:#fff}.sheet .cta{display:none}body{padding:0;background:#fff}.receipt{border:0}}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:46px;height:46px;border-radius:13px;box-shadow:0 2px 8px rgba(0,0,0,.25);background:#fff}
.brand b{font-size:19px;display:block;line-height:1.15}.brand small{opacity:.9;font-size:12px}
.hd{display:flex;justify-content:space-between;align-items:center}
.chat{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:20px;padding:9px 15px;font-size:14px;cursor:pointer}
.hero h1{font-size:22px;margin:26px 0 0;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="produk.js"></script>
<script>
var S={ord:[],cur:null,tab:'home',phone:''};
try{var s=JSON.parse(localStorage.getItem('zvx_pesanan')||'null');if(Array.isArray(s))S.ord=s}catch(e){}
function save(){try{localStorage.setItem('zvx_pesanan',JSON.stringify(S.ord))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var rp=function(n){return 'Rp'+Math.round(n).toLocaleString('id-ID')};
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2200)}
function open_(h){$('sheet').innerHTML=h;$('ov').classList.add('on')}
function close_(){$('ov').classList.remove('on')}
$('ov').addEventListener('click',function(e){if(e.target===$('ov'))close_()});
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

var JASA=PRODUK.jasa,PULSA=PRODUK.pulsa,DATA=PRODUK.data,TOKEN=PRODUK.token,TOKENP=PRODUK.tokenp,MU=PRODUK.markupPulsa;

function opr(n){var p=n.slice(0,4);
 if(/^08(11|12|13|21|22|23|52|53|51)$/.test(p))return 'Telkomsel';
 if(/^08(14|15|16|55|56|57|58)$/.test(p))return 'Indosat';
 if(/^08(17|18|19|59|77|78)$/.test(p))return 'XL';
 if(/^08(95|96|97|98|99)$/.test(p))return 'Tri';
 if(/^08(81|82|83|84|85|86|87|88|89)$/.test(p))return 'Smartfren';return ''}

function home(){
 var h='<div class="hero"><div class="hd"><div class="brand"><img src="icon-192.png" alt="Logo ZVX STORE"><div><b>ZVX STORE</b><small>Pulsa · Token · Jasa Online</small></div></div><button class="chat" onclick="wa()">💬 Chat</button></div><h1>Mau beli apa hari ini?</h1></div>'
 +'<div class="box up"><div class="grid">'
 +mi('📱','Pulsa & Data','pulsa()')+mi('💡','Listrik','listrik()')+mi('🧑‍💻','Jasa Online','jasa()')+mi('💬','Chat Admin','wa()')
 +mi('🎮','Voucher Game',"toast('Voucher game segera hadir')")+mi('🏥','BPJS',"tagihan('bpjs')")+mi('🚗','E-Samsat',"tagihan('samsat')")+mi('⋯','Lainnya',"toast('Layanan lain segera hadir')")
 +'</div></div>'
 +'<div class="promo"><b>Pulsa mulai '+rp(PULSA[0]+MU)+'</b>Semua operator, proses cepat.<br><button onclick="pulsa()">Beli sekarang</button></div>'
 +'<h2>Jasa online populer</h2><div class="list">'+JASA.slice(0,3).map(function(j,k){return svc(j,k)}).join('')+'</div>'
 +'<h2>Pesanan terakhir</h2>'+ordList(S.ord.slice(0,3));
 return h}
function mi(i,n,f){return '<button onclick="'+f+'"><i>'+i+'</i>'+n+'</button>'}
function svc(j,k){return '<div class="row"><div class="svc"><i>'+j.i+'</i><div><b>'+j.n+'</b><small>'+j.d+' · '+rp(j.p)+'</small></div></div><button class="btn2" onclick="pesan('+k+')">Pesan</button></div>'}
var TOKO=PRODUK.toko,PAY=PRODUK.pay;
function payOf(k){for(var i=0;i<PAY.length;i++)if(PAY[i].k===k)return PAY[i];return PAY[1]}
function waNo(){var n=String(TOKO.wa||'').replace(/\D/g,'');if(n.indexOf('0')===0)n='62'+n.slice(1);return n}
function wa(msg){window.open('https://wa.me/'+waNo()+(msg?'?text='+encodeURIComponent(msg):''),'_blank')}
function ta(o){return o.a?rp(o.a):'Dicek admin'}
function ordList(a){if(!a.length)return '<div class="list"><div class="empty">Belum ada pesanan. Pilih layanan di atas untuk mulai belanja.</div></div>';
 return '<div class="list">'+a.map(function(o,k){return '<div class="row" style="cursor:pointer" onclick="ordView('+k+')"><div><b>'+esc(o.t)+'</b><small>'+esc(o.s)+' · '+esc(o.d)+'</small></div><div class="amt">'+ta(o)+'</div></div>'}).join('')+'</div>'}
function actv(){return '<h2>Pesanan</h2>'+ordList(S.ord)}
function info(){return '<h2>Info toko</h2><div class="list"><div class="row"><div><b>ZVX STORE</b><small>Jl. Raya Bapuhbandung No. 5, Glagah, Lamongan</small></div></div><div class="row"><div><b>Cara pesan</b><small>Pilih produk, isi nomor tujuan, bayar lewat transfer bank, DANA, GoPay, ShopeePay, atau QRIS, lalu kirim bukti bayar ke WhatsApp admin</small></div></div><div class="row"><div>Hubungi admin</div><button class="btn2" onclick="wa()">Chat</button></div><div class="row"><div>Mode tampilan</div><button class="btn2" onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme===\'dark\'?\'light\':\'dark\'">Ganti</button></div><div class="row"><div><b>Menu admin</b><small>Khusus admin (perlu sandi)</small></div><a class="btn2" href="admin.html" style="text-decoration:none">Buka 🔒</a></div></div>'}
function draw(){
 $('app').innerHTML={home:home,act:actv,me:info}[S.tab]();
 var n=[['home','🏠','Beranda'],['act','🧾','Pesanan'],['me','🏪','Info toko']];
 $('nav').innerHTML=n.map(function(x){return '<button class="'+(S.tab===x[0]?'on':'')+'" onclick="S.tab=\''+x[0]+'\';draw();scrollTo(0,0)"><i>'+x[1]+'</i>'+x[2]+'</button>'}).join('')}

function orderText(o){return '*Pesanan '+TOKO.nama+'*\nNo: '+o.id+'\nProduk: '+o.t+'\nTujuan: '+o.s+'\nTotal: '+(o.a?rp(o.a):'(mohon dicek admin)')+'\nPembayaran: '+(o.m||'DANA')+'\n\nSaya kirim bukti pembayaran di chat ini.'}
function bayar(title,sub,amt){
 ordShow({id:'ZVX-'+Date.now().toString().slice(-8),t:title,s:sub,a:amt,m:'DANA',d:new Date().toLocaleDateString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})})}
function ordView(k){if(S.ord[k])ordShow(S.ord[k])}
function payPick(k){if(!S.cur)return;S.cur.m=k;if(S.ord.some(function(x){return x.id===S.cur.id}))save();ordShow(S.cur)}
function payCopy(){var p=payOf(S.cur.m);try{navigator.clipboard.writeText(p.no);toast('Nomor disalin')}catch(e){toast('Salin manual: '+p.no)}}
function payBox(o){var p=payOf(o.m),t='<b style="color:var(--tx)">'+rp(o.a)+'</b>';
 if(!o.a)return '<p style="color:var(--mut);font-size:14px;line-height:1.6;margin-top:10px">Total tagihan dan cara bayar akan dikirim admin lewat WhatsApp setelah kamu kirim pesanan.</p>';
 if(p.k==='QRIS')return '<p style="color:var(--mut);font-size:14px;line-height:1.6">Scan QRIS di bawah (nama merchant yang tampil: <b style="color:var(--tx)">'+esc(p.nama||'ZVX STORE')+'</b>), lalu bayar tepat '+t+'.</p><div style="text-align:center;margin:10px 0"><img src="'+p.qris+'" alt="QRIS ZVX STORE" style="width:100%;max-width:260px;border-radius:12px;background:#fff" onerror="this.style.display=\'none\';document.getElementById(\'qn\').style.display=\'block\'"><p id="qn" style="display:none;color:var(--mut);font-size:14px">Kode QRIS akan dikirim admin lewat WhatsApp setelah kamu kirim pesanan.</p></div>';
 if(p.no)return '<p style="color:var(--mut);font-size:14px;line-height:1.6">Transfer '+t+' ke <b style="color:var(--tx)">'+esc(p.k+(p.bank?' '+p.bank:''))+' '+esc(p.no)+'</b> a.n. '+esc(p.an)+'.</p><button class="cta" style="background:var(--bg);color:var(--tx);margin:0 0 4px" onclick="payCopy()">Salin nomor</button>';
 return '<p style="color:var(--mut);font-size:14px;line-height:1.6">Total bayar '+t+'. Nomor '+esc(p.k)+' akan dikirim admin lewat WhatsApp setelah kamu kirim pesanan.</p>'}
function ordShow(o){S.cur=o;if(!o.m)o.m='DANA';
 open_('<h3>Konfirmasi pesanan</h3><div class="list" style="margin:0 0 4px"><div class="row"><div><b>'+esc(o.t)+'</b><small>'+esc(o.s)+'</small></div><div class="amt">'+ta(o)+'</div></div></div>'
 +'<label>Pilih metode pembayaran</label><div class="chips">'+PAY.map(function(p){return '<div class="chip'+(o.m===p.k?' on':'')+'" onclick="payPick(\''+p.k+'\')">'+p.k+'</div>'}).join('')+'</div>'
 +payBox(o)
 +'<p style="color:var(--mut);font-size:13px;line-height:1.6;margin-top:10px">Setelah bayar, kirim pesanan dan bukti bayar ke WhatsApp admin. Pesanan diproses setelah pembayaran dicek.</p>'
 +'<button class="cta" onclick="ordWa()">Kirim pesanan via WhatsApp</button>'
 +'<button class="cta" style="background:var(--bg);color:var(--tx);margin-top:8px" onclick="close_()">Tutup</button>')}
function ordWa(){var o=S.cur;if(!o)return;if(!S.ord.some(function(x){return x.id===o.id})){S.ord.unshift(o);save();draw()}wa(orderText(o))}

var ADM=PRODUK.adm;
var TG={bpjs:{n:'BPJS Kesehatan',l:'Nomor VA BPJS',ph:'16 digit nomor VA',im:'numeric'},samsat:{n:'E-Samsat',l:'Nomor polisi',ph:'Contoh: S 1234 AB',im:''}};
function tagihan(k){S.tg=k;var t=TG[k];
 open_('<h3>'+t.n+'</h3><label for="tg1">'+t.l+'</label><input id="tg1" '+(t.im?'inputmode="'+t.im+'" ':'')+'placeholder="'+t.ph+'" autocomplete="off"><label for="tg2">Nama pemilik (opsional)</label><input id="tg2" autocomplete="off"><label for="tg3">Nominal tagihan, jika sudah tahu (opsional)</label><input id="tg3" inputmode="numeric" placeholder="Contoh: 150000"><label for="tg4">Catatan (opsional)</label><input id="tg4" autocomplete="off"><p style="color:var(--mut);font-size:13px;margin-top:12px;line-height:1.5">Biaya admin '+rp(ADM[k])+'. Kalau nominal dikosongkan, admin akan mengecek tagihan dan membalas lewat WhatsApp.</p><button class="cta" onclick="tgGo()">Lanjut</button>')}
function tgGo(){var k=S.tg,t=TG[k],no=$('tg1').value.trim();if(no.length<5){toast('Isi nomor tagihan dulu');return}
 var nom=parseInt($('tg3').value.replace(/\D/g,''))||0,nama=$('tg2').value.trim(),cat=$('tg4').value.trim();
 bayar(nom?t.n+' '+rp(nom)+' + admin '+rp(ADM[k]):t.n+' (cek tagihan)',no+(nama?' · '+nama:'')+(cat?' · '+cat:''),nom?nom+ADM[k]:0)}

var sel=null,mode='pulsa';
function pulsa(){sel=null;mode='pulsa';pl()}
function pl(){
 var items=mode==='pulsa'?PULSA.map(function(v){return {n:rp(v),d:'Pulsa',p:v+MU}}):DATA;
 open_('<h3>Pulsa & Data</h3><div class="tabs"><button class="'+(mode==='pulsa'?'on':'')+'" onclick="mode=\'pulsa\';sel=null;pl()">Pulsa</button><button class="'+(mode==='data'?'on':'')+'" onclick="mode=\'data\';sel=null;pl()">Paket data</button></div>'
 +'<label for="no">Nomor ponsel</label><input id="no" inputmode="numeric" maxlength="14" placeholder="08xx xxxx xxxx" value="'+esc(S.phone)+'" oninput="S.phone=this.value.replace(/\\D/g,\'\');var o=opr(S.phone);$(\'op\').innerHTML=o?\'<span class=op>\'+o+\'</span>\':\'\';chk()"><div id="op">'+(opr(S.phone)?'<span class="op">'+opr(S.phone)+'</span>':'')+'</div>'
 +'<label>Pilih nominal</label><div class="chips">'+items.map(function(x,k){return '<div class="chip'+(sel===k?' on':'')+'" onclick="sel='+k+';pl()">'+x.n+'<small>'+(mode==='pulsa'?rp(x.p):x.d+' · '+rp(x.p))+'</small></div>'}).join('')+'</div>'
 +'<button class="cta" id="go" disabled onclick="goPulsa()">'+(sel!==null?'Pesan '+rp(items[sel].p):'Pesan')+'</button>');chk()}
function chk(){var b=$('go');if(b)b.disabled=!(S.phone.length>=10&&sel!==null)}
function goPulsa(){var items=mode==='pulsa'?PULSA.map(function(v){return {n:rp(v),p:v+MU}}):DATA;var x=items[sel];bayar((mode==='pulsa'?'Pulsa ':'')+x.n,S.phone+' · '+(opr(S.phone)||'Operator'),x.p)}

var lid='';
function listrik(){sel=null;ll()}
function ll(){open_('<h3>Token listrik</h3><label for="id">ID pelanggan / nomor meter</label><input id="id" inputmode="numeric" maxlength="12" placeholder="11 atau 12 digit" value="'+esc(lid)+'" oninput="lid=this.value.replace(/\\D/g,\'\');lc()"><label>Nominal token</label><div class="chips">'+TOKEN.map(function(v,k){return '<div class="chip'+(sel===k?' on':'')+'" onclick="sel='+k+';ll()">'+rp(v)+'<small>'+rp(TOKENP[v])+'</small></div>'}).join('')+'</div><button class="cta" id="lg" disabled onclick="bayar(\'Token listrik \'+rp(TOKEN[sel]),lid,TOKENP[TOKEN[sel]])">'+(sel!==null?'Pesan '+rp(TOKENP[TOKEN[sel]]):'Pesan')+'</button>');lc()}
function lc(){var b=$('lg');if(b)b.disabled=!(lid.length>=11&&sel!==null)}

function jasa(){open_('<h3>Jasa online</h3><div class="list" style="margin:0">'+JASA.map(svc).join('')+'</div>')}
function pesan(k){var j=JASA[k];open_('<h3>Pesan '+j.n+'</h3><p style="color:var(--mut)">'+j.d+'</p><label for="cat">Catatan untuk penyedia jasa</label><input id="cat" placeholder="Contoh: nama brand, warna, referensi"><button class="cta" onclick="bayar(\''+j.n+'\',($(\'cat\').value.trim()||\'Pesanan jasa\'),'+j.p+')">Pesan '+rp(j.p)+'</button>')}

draw();
